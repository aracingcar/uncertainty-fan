[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroclimate-uncertainty-fan"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "xarray>=2024.1", "pandas>=2", "pyarrow>=18", "zarr>=3", "fastapi>=0.115", "uvicorn>=0.30", "duckdb>=1.1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["hydrofan*"]
